    <script>
    // 1. Tell Tailwind to use class-based dark mode
    window.tailwind = {
      darkMode: 'class'
    };

    // 2. Declare top-level hoisted functions for theme toggling
    function toggleTheme() {
      var isDark = document.documentElement.classList.contains('dark');
      if (isDark) {
        document.documentElement.classList.remove('dark');
        try { localStorage.setItem('recipe_theme', 'light'); } catch(e) {}
        updateThemeUI('🌙', 'Dunkel');
      } else {
        document.documentElement.classList.add('dark');
        try { localStorage.setItem('recipe_theme', 'dark'); } catch(e) {}
        updateThemeUI('☀️', 'Hell');
      }
    }
    window.toggleTheme = toggleTheme;

    function updateThemeUI(icon, text) {
      var icons = document.querySelectorAll('.theme-toggle-icon');
      for (var i = 0; i < icons.length; i++) icons[i].textContent = icon;
      var labels = document.querySelectorAll('.theme-toggle-label');
      for (var j = 0; j < labels.length; j++) labels[j].textContent = text;
    }
    window.updateThemeUI = updateThemeUI;

    // 3. Immediate theme setup to prevent flash of wrong theme
    (function() {
      try {
        var saved = localStorage.getItem('recipe_theme') || 'light';
        if (saved === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch(e) {}
    })();

    document.addEventListener('DOMContentLoaded', function() {
      var isDark = document.documentElement.classList.contains('dark');
      updateThemeUI(isDark ? '☀️' : '🌙', isDark ? 'Hell' : 'Dunkel');
    });
  </script>

    let currentFilteredRecipes = [...recipes];

    const categoryLabels = {
      'alle': 'Alle Rezepte',
      'reis': 'Reis',
      'nudeln': 'Nudeln & Gnocchi',
      'kartoffeln': 'Kartoffeln',
      'auflauf': 'Aufläufe',
      'brot': 'Brot & Wraps'
    };

    // Immer gerundete Ganzzahlen – absolut keine Kommazahlen!
    function formatQuantity(val) {
      if (!val || val <= 0) return "";
      let rounded = Math.round(val);
      if (rounded < 1) rounded = 1;
      return rounded.toString();
    }

    function updateFilterStatus() {
      const statusText = document.getElementById('filter-status-text');
      const countText = document.getElementById('filter-count');
      const resetLink = document.getElementById('reset-filter-link');

      let label = categoryLabels[currentCategory] || 'Rezepte';
      if (currentMeat) {
        const meatLabels = { haehnchen: 'Hähnchen', rind: 'Rind', garnelen: 'Garnelen' }; label += ` • ${meatLabels[currentMeat] || currentMeat}`;
      }
      if (searchQuery.trim().length > 0) {
        label += ` (Suche: "${searchQuery.trim()}")`;
      }

      statusText.textContent = label;
      countText.textContent = currentFilteredRecipes.length;

      if (currentCategory !== 'alle' || currentMeat !== null || searchQuery.trim().length > 0) {
        resetLink.classList.remove('hidden');
      } else {
        resetLink.classList.add('hidden');
      }
    }

    function renderCardHeader(r) {
      if (r.image) {
        return `
          <div class="relative h-48 w-full overflow-hidden bg-[var(--muted)]">
            <img src="${r.image}" alt="${r.title}" loading="lazy" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300">
          </div>
        `;
      } else {
        const icon = r.category === 'reis' ? '🍚' : r.category === 'nudeln' ? '🍝' : r.category === 'kartoffeln' ? '🥔' : r.category === 'auflauf' ? '🥘' : '🥖';
        return `
          <div class="relative h-36 w-full flex flex-col items-center justify-center bg-[var(--muted)] border-b border-[var(--border)] p-4 text-center">
            <span class="text-4xl mb-1.5">${icon}</span>
            <span class="text-xs font-bold uppercase tracking-wider text-amber-500">${categoryLabels[r.category] || r.category}</span>
          </div>
        `;
      }
    }

    function renderRecipes() {
      const grid = document.getElementById('recipes-grid');
      const noResults = document.getElementById('no-results');

      currentFilteredRecipes = recipes.filter(r => {
        const matchCategory = (currentCategory === 'alle') || (r.category === currentCategory);
        const matchMeat = !currentMeat || (r.meat === currentMeat);
        const q = searchQuery.toLowerCase().trim();
        const matchSearch = !q || 
          r.title.toLowerCase().includes(q) ||
          r.teaser.toLowerCase().includes(q) ||
          r.category.toLowerCase().includes(q) ||
          (r.meat && r.meat.toLowerCase().includes(q)) ||
          r.ingredientGroups.some(cat => cat.items.some(item => item.name.toLowerCase().includes(q)));

        return matchCategory && matchMeat && matchSearch;
      });

      updateFilterStatus();

      if (currentFilteredRecipes.length === 0) {
        grid.innerHTML = '';
        noResults.classList.remove('hidden');
        return;
      }

      noResults.classList.add('hidden');
      grid.innerHTML = currentFilteredRecipes.map((r, idx) => `
        <article 
          onclick="openDetail('${r.id}')"
          class="bg-[var(--card)] border border-[var(--border)] rounded-xl overflow-hidden shadow-sm hover:border-amber-500 transition-all cursor-pointer flex flex-col group active:scale-[0.99]"
        >
          ${renderCardHeader(r)}
          <div class="p-4 flex-1 flex flex-col justify-between">
            <div>
              <div class="flex flex-wrap items-center gap-2 text-xs text-[var(--muted-foreground)] mb-1.5">
                <span>⏱️ ${r.time}</span>
                <span>•</span>
                <span class="text-amber-500 font-bold">🔥 ~${r.kcalPerPortion} kcal / Port.</span>
              </div>
              <h3 class="font-semibold text-base leading-snug group-hover:underline">${r.title}</h3>
              <p class="text-[var(--muted-foreground)] text-xs mt-1.5 line-clamp-2 leading-relaxed">${r.teaser}</p>
            </div>
            <div class="pt-3 mt-3 border-t border-[var(--border)] flex items-center justify-between text-xs">
              <span class="text-amber-500 font-medium capitalize">
                ${categoryLabels[r.category] || r.category}
              </span>
              <span class="font-medium text-xs text-amber-500 hover:underline">Portionen anpassen (1–6) →</span>
            </div>
          </div>
        </article>
      `).join('');
    }

    function openDetail(recipeId) {
      const idx = recipes.findIndex(r => r.id === recipeId);
      if (idx === -1) return;
      currentRecipeIndex = idx;
      showDetailView();
    }

    function showDetailView() {
      const r = recipes[currentRecipeIndex];
      if (!r) return;

      const imgContainer = document.getElementById('detail-image-container');
      if (r.image) {
        imgContainer.classList.remove('hidden');
        imgContainer.innerHTML = `
          <img src="${r.image}" alt="${r.title}" class="w-full h-64 sm:h-80 md:h-96 object-cover">
        `;
      } else {
        imgContainer.classList.add('hidden');
        imgContainer.innerHTML = '';
      }

      document.getElementById('detail-title').textContent = r.title;
      document.getElementById('detail-teaser').textContent = r.teaser;
      document.getElementById('detail-time').textContent = `⏱️ ${r.time}`;
      document.getElementById('detail-calories-badge').textContent = `🔥 ca. ${r.kcalPerPortion} kcal pro Portion`;
      document.getElementById('detail-category').textContent = categoryLabels[r.category] || r.category;
      document.getElementById('detail-counter').textContent = `${currentRecipeIndex + 1} / ${recipes.length}`;

      updatePortionUI();

      // Steps
      document.getElementById('detail-steps').innerHTML = r.steps.map((step, i) => `
        <div class="flex gap-3.5 p-3 rounded-xl bg-[var(--card)] border border-[var(--border)] text-xs sm:text-sm leading-relaxed">
          <div class="flex-shrink-0 w-6 h-6 rounded-full bg-[var(--background)] border border-[var(--border)] font-bold flex items-center justify-center text-xs text-amber-500">
            ${i + 1}
          </div>
          <p class="pt-0.5">${step}</p>
        </div>
      `).join('');

      // Alternatives
      document.getElementById('detail-alternatives').innerHTML = r.alternatives.map(alt => `
        <li class="flex items-start gap-2">
          <span class="text-amber-500 font-bold">•</span>
          <span>${alt}</span>
        </li>
      `).join('');

      document.getElementById('view-overview').classList.add('hidden');
      document.getElementById('view-detail').classList.remove('hidden');
      window.scrollTo(0, 0);
    }

    // ================= PORTIONS CALCULATOR LOGIC (1 - 6) =================
    function setPortion(p) {
      if (p < 1) p = 1;
      if (p > 6) p = 6;
      selectedPortions = p;
      updatePortionUI();
    }

    function changePortionBy(delta) {
      setPortion(selectedPortions + delta);
    }

    function updatePortionUI() {
      const r = recipes[currentRecipeIndex];
      if (!r) return;

      document.getElementById('portions-display').textContent = selectedPortions;
      
      const decBtn = document.getElementById('btn-portion-dec');
      const incBtn = document.getElementById('btn-portion-inc');
      if (decBtn) decBtn.style.opacity = selectedPortions <= 1 ? '0.35' : '1';
      if (incBtn) incBtn.style.opacity = selectedPortions >= 6 ? '0.35' : '1';

      const totalKcal = Math.round(r.kcalPerPortion * selectedPortions);
      const summaryEl = document.getElementById('portions-calc-summary');
      if (summaryEl) {
        summaryEl.textContent = `ca. ${totalKcal.toLocaleString('de-DE')} kcal gesamt`;
      }

      document.getElementById('detail-ingredients').innerHTML = r.ingredientGroups.map(group => `
        <div class="bg-[var(--card)] p-3.5 rounded-xl border border-[var(--border)]">
          <div class="text-xs font-semibold text-[var(--muted-foreground)] uppercase tracking-wider mb-2">${group.name}</div>
          <ul class="space-y-2 text-xs sm:text-sm">
            ${group.items.map((item, i) => {
              const qty = formatQuantity(item.base * selectedPortions);
              return `
                <li class="list-none">
                  <label class="flex items-start gap-3 p-2 sm:p-2.5 rounded-xl border border-[var(--border)] bg-[var(--background)] hover:border-amber-500/50 cursor-pointer active:scale-[0.99] transition-all select-none">
                    <input type="checkbox" id="check-${r.id}-${group.name}-${i}" class="mt-0.5 rounded cursor-pointer accent-amber-500 flex-shrink-0">
                    <span class="leading-relaxed text-[var(--foreground)] text-xs sm:text-sm">
                      <strong class="text-amber-500 font-bold">${qty} ${item.unit}</strong> ${item.name}
                    </span>
                  </label>
                </li>
              `;
            }).join('')}
          </ul>
        </div>
      `).join('');
    }

    function showOverview() {
      document.getElementById('view-detail').classList.add('hidden');
      document.getElementById('view-overview').classList.remove('hidden');
    }

    function navigateRecipe(direction) {
      currentRecipeIndex = (currentRecipeIndex + direction + recipes.length) % recipes.length;
      showDetailView();
    }

    function handleFilter() {
      const input = document.getElementById('search-input');
      const clearBtn = document.getElementById('clear-search');
      searchQuery = input.value;
      if (searchQuery.length > 0) {
        clearBtn.classList.remove('hidden');
      } else {
        clearBtn.classList.add('hidden');
      }
      
    renderRecipes();
    }

    function clearSearch() {
      document.getElementById('search-input').value = '';
      searchQuery = '';
      document.getElementById('clear-search').classList.add('hidden');
      renderRecipes();
    }

    function setCategory(cat) {
      currentCategory = cat;
      document.querySelectorAll('.filter-btn').forEach(btn => {
        if (btn.getAttribute('data-cat') === cat) {
          btn.className = 'filter-btn px-4 py-2 rounded-lg text-xs font-bold border transition-all duration-150 bg-amber-500 text-black border-amber-500 shadow-sm ring-2 ring-amber-500/20';
        } else {
          btn.className = 'filter-btn px-4 py-2 rounded-lg text-xs font-medium border transition-all duration-150 bg-[var(--card)] border-[var(--border)] text-[var(--muted-foreground)] hover:text-[var(--foreground)] hover:border-[var(--foreground)]';
        }
      });
      renderRecipes();
    }

    function toggleMeatFilter(type) {
      if (currentMeat === type) {
        currentMeat = null;
      } else {
        currentMeat = type;
      }
      ['haehnchen', 'rind', 'garnelen'].forEach(t => {
        const b = document.getElementById(`meat-${t}`);
        if (!b) return;
        if (t === currentMeat) {
          b.className = 'meat-btn px-3 py-2 rounded-lg text-xs border transition-all bg-amber-500 text-black border-amber-500 font-bold';
        } else {
          b.className = 'meat-btn px-3 py-2 rounded-lg text-xs border transition-all border-[var(--border)] bg-[var(--card)] text-[var(--muted-foreground)] hover:border-[var(--foreground)]';
        }
      });
      renderRecipes();
    }

    function resetAllFilters() {
      currentCategory = 'alle';
      currentMeat = null;
      searchQuery = '';
      document.getElementById('search-input').value = '';
      document.getElementById('clear-search').classList.add('hidden');
      setCategory('alle');
      document.querySelectorAll('.meat-btn').forEach(b => {
        b.className = 'meat-btn px-3 py-2 rounded-lg text-xs border transition-all border-[var(--border)] bg-[var(--card)] text-[var(--muted-foreground)] hover:border-[var(--foreground)]';
      });
      renderRecipes();
    }

    document.addEventListener('keydown', (e) => {
      const isDetailActive = !document.getElementById('view-detail').classList.contains('hidden');
      if (isDetailActive) {
        if (e.key === 'Escape') showOverview();
        if (e.key === 'ArrowRight') navigateRecipe(1);
        if (e.key === 'ArrowLeft') navigateRecipe(-1);
      }
    });

    renderRecipes();
  
    // Touch Swipe Gestures for Mobile (iPad / iPhone)
    let touchStartX = 0;
    let touchStartY = 0;
    const detailEl = document.getElementById('view-detail');
    if (detailEl) {
      detailEl.addEventListener('touchstart', (e) => {
        touchStartX = e.changedTouches[0].screenX;
        touchStartY = e.changedTouches[0].screenY;
      }, { passive: true });
      detailEl.addEventListener('touchend', (e) => {
        const diffX = e.changedTouches[0].screenX - touchStartX;
        const diffY = e.changedTouches[0].screenY - touchStartY;
        if (Math.abs(diffX) > 60 && Math.abs(diffX) > Math.abs(diffY) * 1.5) {
          if (diffX < 0) navigateRecipe(1);
          else navigateRecipe(-1);
        }
      }, { passive: true });
    }
  
    
    </script>
